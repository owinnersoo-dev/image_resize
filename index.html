<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Manual Therapy Clinic 3D</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dfeaf2;font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  #gameWrap{position:relative;width:100%;height:100%}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .hud{
    position:absolute;left:14px;top:14px;z-index:4;
    background:rgba(17,27,39,.78);color:#fff;border:1px solid rgba(255,255,255,.18);
    border-radius:16px;padding:12px 14px;backdrop-filter:blur(8px);
    min-width:210px;box-shadow:0 10px 30px rgba(0,0,0,.18)
  }
  .hud b{font-size:14px}
  .hud .big{font-size:26px;font-weight:900;margin-top:4px}
  .hud .small{font-size:12px;opacity:.82;margin-top:4px;line-height:1.45}
  .panel{
    position:absolute;right:14px;top:14px;z-index:4;width:min(330px,42vw);
    background:rgba(255,255,255,.92);border:1px solid rgba(0,0,0,.08);
    border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.14)
  }
  .panel h2{font-size:16px;margin:0 0 8px}
  .patient{font-size:13px;line-height:1.5;color:#24303b}
  .status{margin-top:9px;padding:9px 10px;border-radius:12px;background:#eef4f8;font-size:12px}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  button{
    appearance:none;border:none;border-radius:12px;padding:10px 8px;font-weight:800;
    background:#e9eff4;color:#20303f;cursor:pointer
  }
  button:hover{filter:brightness(.98)}
  button.active{outline:3px solid rgba(32,116,255,.25);background:#dbe9ff}
  button.action{grid-column:1/-1;background:#1f6feb;color:#fff}
  button.reset{background:#fff0f0;color:#a13737}
  .footer{
    position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
    z-index:4;background:rgba(17,27,39,.74);color:#fff;padding:10px 14px;border-radius:14px;
    font-size:12px;backdrop-filter:blur(8px);text-align:center;max-width:80vw
  }
  .toast{
    position:absolute;left:50%;top:16%;transform:translateX(-50%);
    z-index:5;color:#fff;font-weight:900;font-size:clamp(22px,4vw,46px);
    text-shadow:0 3px 12px rgba(0,0,0,.3);opacity:0;transition:.25s
  }
  @media(max-width:760px){
    .panel{top:auto;bottom:84px;right:10px;left:10px;width:auto;max-height:42vh;overflow:auto}
    .hud{left:10px;top:10px;min-width:170px}
    .footer{bottom:12px;font-size:11px;width:88vw}
  }
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="c"></canvas>

  <div class="hud">
    <b>MANUAL THERAPY CLINIC</b>
    <div class="big">점수 <span id="score">0</span></div>
    <div class="small">환자 <span id="caseNum">1</span> / 5<br>신뢰도 <span id="trust">100</span>%</div>
  </div>

  <div class="panel">
    <h2>환자 평가</h2>
    <div class="patient" id="patientText"></div>
    <div class="status" id="statusText">치료 부위를 선택하세요.</div>

    <div class="choices" id="regionBtns">
      <button data-region="neck">목</button>
      <button data-region="shoulder">어깨</button>
      <button data-region="lowback">허리</button>
      <button data-region="knee">무릎</button>
    </div>

    <div class="choices" id="treatBtns">
      <button data-treat="mob">관절가동술</button>
      <button data-treat="mfr">연부조직 이완</button>
      <button data-treat="exercise">운동치료</button>
      <button data-treat="education">교육/자세교정</button>
      <button class="action" id="applyBtn">선택한 치료 시행</button>
      <button class="reset" id="resetBtn">게임 재시작</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="footer">
    마우스/손가락 드래그로 치료실 시점을 움직여 보세요 · 게임형 교육 시뮬레이션이며 실제 진료 지침이 아닙니다.
  </div>
</div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize); resize();

let yaw=0,pitch=0,drag=false,lastX=0,lastY=0;
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{
  if(!drag)return;
  yaw+=(e.clientX-lastX)*0.004;
  pitch+=(e.clientY-lastY)*0.002;
  pitch=Math.max(-0.18,Math.min(0.16,pitch));
  lastX=e.clientX;lastY=e.clientY;
});
canvas.addEventListener('pointerup',()=>drag=false);
canvas.addEventListener('pointercancel',()=>drag=false);

const cases=[
 {region:'shoulder',name:'김OO',desc:'오른쪽 어깨를 들어 올릴 때 통증. 야간통은 거의 없고, 움직임 끝범위에서 뻣뻣함을 호소.',best:['mob','exercise']},
 {region:'lowback',name:'박OO',desc:'오래 앉은 뒤 허리 뻐근함. 다리 저림은 없고, 자세 변화에 따라 증상이 달라짐.',best:['education','exercise']},
 {region:'neck',name:'이OO',desc:'컴퓨터 작업 후 목과 견갑대 긴장. 팔 저림은 없고 휴식하면 호전됨.',best:['mfr','education']},
 {region:'knee',name:'최OO',desc:'수술 후 회복 단계의 무릎 뻣뻣함. 통증 범위 안에서 움직임 회복과 근기능 향상이 목표.',best:['exercise','mob']},
 {region:'shoulder',name:'정OO',desc:'가벼운 어깨 불편감과 움직임 두려움. 급성 외상은 없고 기능 회복이 주 목표.',best:['education','exercise']}
];

let idx=0,score=0,trust=100,selectedRegion='',selectedTreat='';
const patientText=document.getElementById('patientText');
const statusText=document.getElementById('statusText');
const scoreEl=document.getElementById('score');
const trustEl=document.getElementById('trust');
const caseNumEl=document.getElementById('caseNum');
const toast=document.getElementById('toast');

function loadCase(){
  const c=cases[idx];
  patientText.innerHTML=`<b>${c.name}</b><br>${c.desc}`;
  statusText.textContent='치료 부위를 선택하세요.';
  selectedRegion='';selectedTreat='';
  document.querySelectorAll('button[data-region],button[data-treat]').forEach(b=>b.classList.remove('active'));
  caseNumEl.textContent=idx+1;
}
loadCase();

document.querySelectorAll('button[data-region]').forEach(b=>{
  b.onclick=()=>{
    selectedRegion=b.dataset.region;
    document.querySelectorAll('button[data-region]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    statusText.textContent='이제 치료 방법을 선택하세요.';
  };
});
document.querySelectorAll('button[data-treat]').forEach(b=>{
  b.onclick=()=>{
    selectedTreat=b.dataset.treat;
    document.querySelectorAll('button[data-treat]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  };
});

function showToast(text){
  toast.textContent=text;toast.style.opacity='1';
  setTimeout(()=>toast.style.opacity='0',900);
}

document.getElementById('applyBtn').onclick=()=>{
  if(!selectedRegion||!selectedTreat){statusText.textContent='부위와 치료 방법을 모두 선택하세요.';return}
  const c=cases[idx];
  let delta=0;
  if(selectedRegion===c.region) delta+=20; else delta-=15;
  if(c.best.includes(selectedTreat)) delta+=25; else delta-=10;

  if(delta>0){
    score+=delta;
    statusText.textContent='환자 반응이 좋습니다. 적절한 판단이었습니다.';
    showToast('GOOD +'+delta);
  }else{
    trust=Math.max(0,trust-10);
    score=Math.max(0,score+delta);
    statusText.textContent='환자 반응이 좋지 않습니다. 평가와 치료 선택을 다시 생각해보세요.';
    showToast('CHECK AGAIN');
  }
  scoreEl.textContent=score;trustEl.textContent=trust;

  setTimeout(()=>{
    idx++;
    if(idx>=cases.length){
      idx=0;
      const final=score;
      alert(`진료 종료! 최종 점수: ${final}점`);
      score=0;trust=100;
      scoreEl.textContent=score;trustEl.textContent=trust;
    }
    loadCase();
  },850);
};

document.getElementById('resetBtn').onclick=()=>{
  idx=0;score=0;trust=100;selectedRegion='';selectedTreat='';
  scoreEl.textContent=0;trustEl.textContent=100;loadCase();
};

function drawRoom(){
  const cx=W/2 + Math.sin(yaw)*W*0.08;
  const horizon=H*0.34 + pitch*H*0.7;

  // ceiling
  ctx.fillStyle='#f6fafc';
  ctx.fillRect(0,0,W,horizon);

  // back wall
  const wall=ctx.createLinearGradient(0,horizon,0,H*.73);
  wall.addColorStop(0,'#edf4f8'); wall.addColorStop(1,'#d8e5ec');
  ctx.fillStyle=wall;
  ctx.fillRect(0,horizon,W,H*.42);

  // floor with perspective
  const floorTop=H*.70;
  const fg=ctx.createLinearGradient(0,floorTop,0,H);
  fg.addColorStop(0,'#c9d7de');fg.addColorStop(1,'#9fb2bc');
  ctx.fillStyle=fg;ctx.fillRect(0,floorTop,W,H-floorTop);

  ctx.strokeStyle='rgba(90,110,120,.22)';
  ctx.lineWidth=1;
  for(let i=-8;i<=8;i++){
    ctx.beginPath();ctx.moveTo(cx,horizon+80);ctx.lineTo(cx+i*W*.12,H);ctx.stroke();
  }
  for(let j=0;j<10;j++){
    const p=j/10;
    const y=floorTop + Math.pow(p,1.55)*(H-floorTop);
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }

  // window
  const wx=W*.08+Math.sin(yaw)*18, wy=horizon+30;
  ctx.fillStyle='#bde8ff';ctx.fillRect(wx,wy,W*.22,H*.20);
  ctx.strokeStyle='#ffffff';ctx.lineWidth=5;ctx.strokeRect(wx,wy,W*.22,H*.20);
  ctx.beginPath();ctx.moveTo(wx+W*.11,wy);ctx.lineTo(wx+W*.11,wy+H*.20);
  ctx.moveTo(wx,wy+H*.10);ctx.lineTo(wx+W*.22,wy+H*.10);ctx.stroke();

  // cabinet
  const cabX=W*.76+Math.sin(yaw)*20, cabY=horizon+48;
  ctx.fillStyle='#f8fbfc';ctx.fillRect(cabX,cabY,W*.13,H*.24);
  ctx.fillStyle='#bfd0d9';
  for(let i=0;i<3;i++)ctx.fillRect(cabX+8,cabY+12+i*H*.07,W*.13-16,H*.045);

  // treatment table (fake 3D)
  const tx=cx-W*.12, ty=H*.57;
  const tw=Math.min(W*.44,520), th=H*.13;
  ctx.fillStyle='#397fbf';
  ctx.beginPath();
  ctx.moveTo(tx-tw*.42,ty);
  ctx.lineTo(tx+tw*.34,ty-H*.035);
  ctx.lineTo(tx+tw*.48,ty+th*.60);
  ctx.lineTo(tx-tw*.30,ty+th*.85);
  ctx.closePath();ctx.fill();

  // table legs
  ctx.fillStyle='#5a6871';
  ctx.fillRect(tx-tw*.26,ty+th*.62,12,H*.18);
  ctx.fillRect(tx+tw*.31,ty+th*.52,12,H*.18);

  drawPatient(tx,ty,tw,th);
  drawTherapist(tx+tw*.18,ty+th*.1);
}

function drawPatient(tx,ty,tw,th){
  ctx.save();
  // body
  ctx.translate(tx,ty-8);
  ctx.rotate(-0.03);
  ctx.fillStyle='#f3c7a5';
  ctx.beginPath();ctx.arc(-tw*.27,-12,22,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='#eef3f6';
  ctx.beginPath();
  ctx.moveTo(-tw*.22,-22);ctx.lineTo(tw*.16,-30);ctx.lineTo(tw*.24,15);ctx.lineTo(-tw*.16,24);ctx.closePath();ctx.fill();

  ctx.fillStyle='#a9b9c5';
  ctx.beginPath();ctx.moveTo(tw*.16,-30);ctx.lineTo(tw*.38,-26);ctx.lineTo(tw*.41,0);ctx.lineTo(tw*.24,15);ctx.closePath();ctx.fill();

  // arm
  ctx.strokeStyle='#f3c7a5';ctx.lineWidth=13;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-tw*.04,-5);ctx.lineTo(tw*.12,14);ctx.stroke();
  ctx.restore();
}

function drawTherapist(x,y){
  ctx.save();ctx.translate(x,y);
  const s=Math.max(.75,Math.min(1.2,W/1100));
  ctx.scale(s,s);

  // shadow
  ctx.fillStyle='rgba(0,0,0,.18)';
  ctx.beginPath();ctx.ellipse(0,138,45,13,0,0,Math.PI*2);ctx.fill();

  // legs
  ctx.fillStyle='#243545';ctx.fillRect(-28,55,19,78);ctx.fillRect(9,55,19,78);

  // torso
  ctx.fillStyle='#e8f4ff';
  ctx.beginPath();ctx.roundRect(-42,-18,84,82,18);ctx.fill();

  // head
  ctx.fillStyle='#efc19d';ctx.beginPath();ctx.arc(0,-52,28,0,Math.PI*2);ctx.fill();

  // hair
  ctx.fillStyle='#333';ctx.beginPath();ctx.arc(0,-59,28,Math.PI,Math.PI*2);ctx.fill();

  // arms/hands hovering over patient
  ctx.strokeStyle='#efc19d';ctx.lineWidth=13;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-33,2);ctx.lineTo(-62,30);ctx.stroke();
  ctx.beginPath();ctx.moveTo(33,2);ctx.lineTo(58,29);ctx.stroke();

  ctx.restore();
}

function drawSelectedZone(){
  const c=cases[idx];
  const labels={
    neck:['목',W*.45,H*.50],
    shoulder:['어깨',W*.49,H*.54],
    lowback:['허리',W*.56,H*.57],
    knee:['무릎',W*.63,H*.60]
  };
  const [label,x,y]=labels[c.region];
  ctx.save();
  ctx.fillStyle='rgba(255,88,88,.20)';
  ctx.strokeStyle='rgba(255,70,70,.85)';
  ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(x+Math.sin(yaw)*20,y,26,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='#b62929';ctx.font='700 12px Arial';
  ctx.fillText(label,x-10,y-34);
  ctx.restore();
}

function render(){
  ctx.clearRect(0,0,W,H);
  drawRoom();
  drawSelectedZone();

  // soft vignette
  const g=ctx.createRadialGradient(W/2,H*.55,Math.min(W,H)*.15,W/2,H*.55,Math.max(W,H)*.8);
  g.addColorStop(0,'rgba(255,255,255,0)');
  g.addColorStop(1,'rgba(30,50,70,.18)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
